<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Hot dog, side-on: bun underneath, sausage poking out both ends, mustard zigzag. Single-colour glyph
       (cut-outs via mask) for use as a CSS mask, same weight as Phosphor fill glyphs. Drawn for the newyork map, 7 Nov 2026. -->
  <defs>
    <mask id="hd">
      <rect width="24" height="24" fill="#fff"/>
      <rect x="0.6" y="6.6" width="22.8" height="6.8" rx="3.4" fill="none" stroke="#000" stroke-width="1.5"/>
      <polyline points="5,10.6 7,8.9 9,10.6 11,8.9 13,10.6 15,8.9 17,10.6 19,8.9" fill="none" stroke="#000"
        stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#hd)" fill="#000">
    <rect x="3" y="10.5" width="18" height="9" rx="4.5"/>
    <rect x="0.6" y="6.6" width="22.8" height="6.8" rx="3.4"/>
  </g>
</svg>
